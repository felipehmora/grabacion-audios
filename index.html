<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graba audio y video en la web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="node_modules/normalize.css/normalize.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="node_modules/toastify-js/src/toastify.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <ul>
        <li>
          <button class="nav-menu-btn" onclick="openNav()" aria-label="Abrir menú">
            <i data-lucide="Menu"></i>
          </button>
        </li>
        <li class="delete-button" id="delete-button">
          <button id="delete">
            <i data-lucide="Trash2"></i>
          </button>
        </li>
      </ul>
    </nav>

    <div id="mySidenav" class="sidenav">
      <a href="javascript:void(0)" class="closebtn" onclick="closeNav()"
        >&times;</a
      >
      <a href="javascript:void(0)" id="nav-transcripciones">Transcribir</a>
    </div>

    <div>
      <button type="button" id="mic" class="record-button">
        <i data-lucide="Mic"></i>
      </button>
    </div>
    <div class="audio-container"></div>
    <div id="transcripts-view" style="display:none">
      <h2 class="transcripts-title">Transcripciones</h2>
      <div id="transcripts-list"></div>
    </div>
    <div class="pagination-controls" id="pagination-controls">
      <button id="prev-page">&larr;</button>
      <span id="page-indicator"></span>
      <button id="next-page">&rarr;</button>
    </div>

    <script src="node_modules/lucide/dist/umd/lucide.min.js"></script>
    <script>
      lucide.createIcons();
    </script>
    <script src="node_modules/toastify-js/src/toastify.js"></script>
    <script src="record.js"></script>
  </body>
</html>
